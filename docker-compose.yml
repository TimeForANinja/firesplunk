version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - PIP_PROXY=${PIP_PROXY:-}
    ports:
      - "80:5000"
      - "5000:5000"
    environment:
      - APP_MONGO_URI=mongodb://mongodb:27017/
      - APP_LAST_N_DAYS=30
      - APP_SPLUNK_SERVER_URL=${APP_SPLUNK_SERVER_URL}
      - APP_SPLUNK_QUERY_TEMPLATE=${APP_SPLUNK_QUERY_TEMPLATE}
    depends_on:
      - mongodb
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        - PIP_PROXY=${PIP_PROXY:-}
    environment:
      - APP_MONGO_URI=mongodb://mongodb:27017/
      - APP_LAST_N_DAYS=30
      - APP_SPLUNK_SERVER_URL=${APP_SPLUNK_SERVER_URL}
      - APP_SPLUNK_USERNAME=${APP_SPLUNK_USERNAME}
      - APP_SPLUNK_PASSWORD=${APP_SPLUNK_PASSWORD}
      - APP_SPLUNK_PORT=${APP_SPLUNK_PORT:-8089}
      - APP_SPLUNK_VERIFY_SSL=${APP_SPLUNK_VERIFY_SSL:-false}
      - APP_SPLUNK_POLL_INTERVAL=${APP_SPLUNK_POLL_INTERVAL:-5}
    depends_on:
      - mongodb
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db


volumes:
  mongo-data:
